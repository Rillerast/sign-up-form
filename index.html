<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sign-up form</title>
</head>
<body>
    <div class="sidebar">
        <img id="green-leafs" src="halie-west-25xggax4bSA-unsplash.jpg" alt="green-leaf plants close-up">
        <div class="logo-container">
            <img id="odin-logo" src="/odin-lined.png" alt="">
            <h1>ODIN</h1>
        </div>
        <p class="credits">Photo by <a href="https://unsplash.com/it/@haliewestphoto?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Halie West</a> on <a href="https://unsplash.com/it/foto/pianta-a-foglia-verde-in-fotografia-ravvicinata-25xggax4bSA?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a></p>
    </div>
    <div class="corpus">
        <header>
            <h2>
                This is not a real online service! You know you need something like this in your life to help you realize 
                your deepest dreams. Sign up <em>now</em> to get started.
            </h2>
            <h2>
                You <em>know</em> you want to.
            </h2>
        </header>
        <main>
            <h2>
                Let's do this!
            </h2>
            <form action="#" method="post" id="registrationForm">
                <div class="inner-form">
                    <div class="form-side">
                        <p>
                            <label for="first-name">FIRST NAME</label>
                            <input type="text" id="first-name" name="first-name" required>
                        </p>
                        <p>
                            <label for="email">EMAIL</label>
                            <input type="email" id="email" name="email" required>
                        </p>
                        <p>
                            <label for="password">PASSWORD</label>
                            <input type="password" id="password" name="password" required>
                        </p>
                    </div>
                    <div class="form-side">
                        <p>
                            <label for="last-name">LAST NAME</label>
                            <input type="text" id="last-name" name="last-name" required>
                        </p>
                        <p>
                            <label for="phone-number">PHONE NUMBER</label>
                            <input type="number" id="phone-number" name="phone-number" required>
                        </p>
                        <p>
                            <label for="password">CONFIRM PASSWORD</label>
                            <input type="password" id="password" name="password" required>
                        </p>
                    </div>
                </div>
            </form>
        </main>
        <footer>
            <button type="submit" form="registrationForm">Create Account</button>
            <p class="have-an-account">Already have an account? <a href="#">Log in</a></p>
        </footer>
    </div>
</body>
</html>
